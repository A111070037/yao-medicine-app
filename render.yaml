services:
  # 後端 API 服務
  - type: web
    name: yao-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false  # 需要在 Render 控制台手動設置
    healthCheckPath: /api/gemini/models

  # 前端靜態網站
  - type: web
    name: yao-frontend
    env: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./wangya
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

